<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dance Count — High-Contrast Friendly</title>
<style>
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.5}
button,a{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}
.wrap{max-width:1260px;margin:0 auto;padding:24px 16px 48px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.top h2{margin:0;font-size:28px;line-height:1.25}.top p{margin:4px 0 0;color:var(--ink2);font-size:16px;max-width:52em}
.top .crumb{display:inline-flex;align-items:center;gap:4px;min-height:48px;color:var(--primary);font-size:16px;font-weight:700}
.viewsw{display:flex;gap:8px}.viewsw button{min-height:48px;padding:0 16px;border:2px solid var(--line);border-radius:999px;background:var(--surface);font-size:16px;font-weight:700}
.viewsw button[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.frames{display:flex;flex-wrap:wrap;gap:24px;justify-content:center}
.frames figure{margin:0}.frames figcaption{margin:0 0 8px;font-size:16px;font-weight:700;color:var(--ink2)}
.phone{position:relative;display:flex;flex-direction:column;width:375px;height:760px;box-sizing:content-box;border:8px solid var(--frame);border-radius:40px;background:var(--bg);overflow:hidden}
.scr{flex:1;overflow-y:auto;padding:16px 16px 24px}
.scr-dock{padding-bottom:112px}.scr-dock8{padding-bottom:104px}
.dock{position:absolute;left:0;right:0;bottom:var(--tabh);padding:12px 16px;background:var(--dockbg);border-top:var(--hair) solid var(--line)}
.dock8{bottom:0}
.tabbar{display:flex;gap:8px;padding:0 8px;height:var(--tabh);border-top:var(--hair) solid var(--line);background:var(--surface)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:48px;text-decoration:none;font-size:16px;font-weight:600;color:var(--ink2)}
.tab[aria-current=page]{color:var(--primary);font-weight:800}
.apphead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}
.brand{display:flex;flex-direction:column;line-height:1.15}.brand b{font-size:22px;letter-spacing:var(--track)}.brand small{font-size:16px;color:var(--ink2)}
.lang{display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0 14px;border:var(--bw) solid var(--line);border-radius:999px;background:var(--surface);font-size:16px;font-weight:700}
.h1{margin:24px 0 12px;font-size:22px;line-height:1.3;letter-spacing:var(--track)}
.resume{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:72px;padding:12px 12px 12px 20px;border:none;border-radius:var(--r);background:var(--primary);color:var(--on-primary);text-align:left}
.resume-txt{display:flex;flex-direction:column;line-height:1.2}.resume-txt .k{font-size:16px;opacity:1}.resume-txt b{font-size:24px}
.resume-go{display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0 16px;border-radius:999px;background:var(--on-primary);color:var(--primary);font-size:18px;font-weight:800}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;min-height:76px;padding:8px 8px 8px 10px;border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left}
.tile b{font-size:18px;line-height:1.3;letter-spacing:-0.01em}.tile small{font-size:16px;color:var(--ink2)}
.teacher{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;margin-top:20px;padding:12px 14px;border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left}
.t-ic{display:grid;place-items:center;width:48px;height:48px;border-radius:999px;background:var(--soft);color:var(--primary)}
.t-txt{flex:1;display:flex;flex-direction:column;line-height:1.3}.t-txt b{font-size:18px}.t-txt small{font-size:16px;color:var(--ink2)}
.t-chev,.v-chev{color:var(--ink2)}
.playhead{display:flex;align-items:baseline;gap:12px}.playhead .h1{margin:8px 0;font-size:28px}.meter{font-size:16px;color:var(--ink2)}
.banner{display:flex;gap:10px;margin:8px 0 12px;padding:12px 14px;border:var(--bw) solid var(--warn-line);border-left-width:6px;border-radius:var(--r-s);background:var(--warn-bg);color:var(--warn-ink)}
.b-ic{margin-top:2px}.b-body b{font-size:18px}.b-body p{margin:2px 0 4px;font-size:16px;line-height:1.45}
.b-link{display:inline-flex;align-items:center;gap:2px;min-height:48px;font-size:18px;font-weight:800;color:var(--warn-ink)}
.countbox{display:flex;flex-direction:column;align-items:center;padding:4px 0 12px}
.now{font-size:var(--count);font-weight:800;line-height:1;color:var(--count-ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.beats{display:flex;gap:10px;margin:12px 0 0;padding:0;list-style:none}
.beats li{display:grid;place-items:center;width:52px;height:40px;border:var(--bw) solid var(--line);border-radius:var(--r-s);font-size:18px;font-weight:700;color:var(--ink2)}
.beats li.on{background:var(--beat-on);border-color:var(--beat-on);color:var(--beat-on-ink);transform:scale(1.08)}
.field{margin-top:8px}.flabel{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:16px;font-weight:700;color:var(--ink2)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:64px;padding:4px;border:var(--bw) solid var(--line);border-radius:var(--r-s);background:var(--surface);line-height:1.2;position:relative}
.opt b{font-size:18px}.opt small{font-size:16px}.opt-check{position:absolute;top:4px;left:6px;width:18px;height:18px}
.opt[aria-checked=true]{background:var(--sel);border-color:var(--sel-line);color:var(--sel-ink)}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tog{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:84px;padding:10px 12px;border:var(--bw) solid var(--line);border-radius:var(--r-s);background:var(--surface);text-align:left}
.tog-l{font-size:18px;font-weight:700}
.sw{display:inline-flex;align-items:center;gap:6px;font-size:16px;font-weight:800}
.sw-k{width:40px;height:24px;border-radius:999px;background:var(--line);position:relative}
.sw-k::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff}
.tog[aria-checked=true] .sw-k{background:var(--primary)}.tog[aria-checked=true] .sw-k::after{left:19px}
.tog[aria-checked=true]{border-color:var(--sel-line)}.tog[aria-checked=true] .sw-t{color:var(--primary)}
.voice{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;margin-top:12px;padding:0 14px;border:var(--bw) solid var(--line);border-radius:var(--r-s);background:var(--surface);font-size:18px;font-weight:700;text-align:left}
.voice span{flex:1}
.more{margin-top:12px}.more summary{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;font-size:18px;font-weight:700;color:var(--ink2);list-style:none;cursor:pointer}
.more summary::-webkit-details-marker{display:none}
.play{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:72px;border:none;border-radius:var(--r);background:var(--primary);color:var(--on-primary);font-size:24px;font-weight:800}
.play .ic{width:32px;height:32px}
.rechead{display:flex;align-items:center;gap:8px}
.back{display:inline-flex;align-items:center;gap:2px;min-height:48px;min-width:48px;padding-right:8px;text-decoration:none;font-size:18px;font-weight:700;color:var(--primary)}
.rtitle{font-size:18px;font-weight:700}
.progress{margin-top:12px}.ptext{font-size:18px;color:var(--ink2)}.ptext b{font-size:24px;color:var(--ink)}
.pbar{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:6px}
.pg{height:10px;border-radius:3px;border:1.5px solid var(--line);background:transparent}.pg.done{background:var(--primary);border-color:var(--primary)}.pg.cur{background:var(--soft);border:2px solid var(--primary)}
.word{text-align:center;margin:28px 0 4px}.w-ja{font-size:56px;font-weight:800;line-height:1.15;letter-spacing:var(--track)}.w-en{font-size:20px;color:var(--ink2)}
.hint{text-align:center;margin:8px 0 20px;font-size:18px;color:var(--ink2)}
.rec{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:144px;height:144px;margin:0 auto;border:none;border-radius:50%;background:var(--rec);color:#fff;font-size:20px;font-weight:800;box-shadow:0 0 0 8px var(--rec-ring)}
.rec .ic{width:44px;height:44px}
.take{display:flex;align-items:center;gap:12px;margin-top:28px;padding:10px 10px 10px 14px;border:var(--bw) solid var(--line);border-radius:var(--r-s);background:var(--surface)}
.wave{flex:1;display:flex;align-items:center;gap:3px;height:44px}.wave i{flex:1;background:var(--ink2);border-radius:2px;min-height:2px}
.listen{display:inline-flex;align-items:center;gap:6px;min-height:56px;padding:0 18px;border:var(--bw) solid var(--primary);border-radius:var(--r-s);background:var(--surface);color:var(--primary);font-size:18px;font-weight:800}
.next{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:56px;border:none;border-radius:var(--r);background:var(--primary);color:var(--on-primary);font-size:20px;font-weight:800}
/* desktop */
.deskwrap{overflow-x:auto;padding-bottom:8px}
.desk{position:relative;width:1200px;height:800px;margin:0 auto;border:var(--hair) solid var(--line);border-radius:16px;background:var(--bg);overflow:hidden}
.d-top{display:flex;align-items:center;gap:32px;height:72px;padding:0 24px;background:var(--surface);border-bottom:var(--hair) solid var(--line)}
.d-tabs{display:flex;gap:8px;flex:1}.d-tabs .tab{flex:none;flex-direction:row;gap:8px;padding:0 16px;font-size:18px}
.d-tabs .tab[aria-current=page]{background:var(--soft);border-radius:999px}
.d-main{display:grid;grid-template-columns:1fr 420px;gap:48px;padding:24px 48px 140px}
.d-left .countbox{padding-top:24px}.d-left .now{font-size:var(--count-d)}.d-left .beats li{width:72px;height:56px;font-size:24px}
.d-dock{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:16px;background:var(--dockbg);border-top:var(--hair) solid var(--line)}
.d-dock .play{width:64%;min-height:80px}
[hidden]{display:none!important}
@media (max-width:440px){
 .wrap{padding:16px 0 32px}.top,.viewsw{padding:0 16px}
 .frames{gap:32px}.frames figcaption{padding:0 16px}
 .phone{width:100%;max-width:100%;border-width:0;border-radius:0;border-top:var(--hair) solid var(--line);border-bottom:var(--hair) solid var(--line);box-sizing:border-box}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:root{--font:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Roboto, "Noto Sans JP", sans-serif;--page:#E9E9E9;--bg:#FFFFFF;--surface:#FFFFFF;--ink:#1A1A1A;--ink2:#3B3B3B;
 --primary:#0A5C55;--on-primary:#FFFFFF;--soft:#DDEFEC;--line:#1A1A1A;--frame:#1A1A1A;--focus:#0A5C55;
 --sel:#0A5C55;--sel-ink:#FFFFFF;--sel-line:#0A5C55;--count:80px;--count-d:184px;--count-ink:#1A1A1A;--beat-on:#1A1A1A;--beat-on-ink:#FFFFFF;
 --warn-bg:#FFF6D6;--warn-ink:#1A1A1A;--warn-line:#1A1A1A;--rec:#B3122B;--rec-ring:#F3D3D8;--dockbg:#FFFFFF;
 --r:12px;--r-s:10px;--gap:8px;--bw:2px;--hair:2px;--tabh:72px;--track:0}
 body{font-size:20px}
 .tiles{grid-template-columns:1fr}
 .tile{flex-direction:row;align-items:center;justify-content:space-between;min-height:60px}
 .tile b,.t-txt b,.tog-l,.voice,.opt b,.more summary,.b-link,.listen,.back,.rtitle,.ptext,.hint,.b-body b{font-size:20px}
 .resume-txt b{font-size:26px}.resume-go{font-size:20px}
 .h1{font-size:24px}.playhead .h1{font-size:30px}
 .tile small,.t-txt small,.meter,.b-body p,.opt small,.sw,.tab,.lang,.brand small,.flabel{font-size:18px}
 .tog{min-height:92px}.opt{min-height:72px}.play{min-height:80px;font-size:26px}
 .beats li{width:60px;height:48px;font-size:22px}
 .sw-k{border:2px solid #1A1A1A;background:#FFFFFF}.sw-k::after{background:#1A1A1A;top:1px;left:1px}
 .tog[aria-checked=true] .sw-k{background:var(--primary);border-color:var(--primary)}.tog[aria-checked=true] .sw-k::after{background:#fff;left:17px}
 .w-ja{font-size:64px}.w-en{font-size:22px}.rec{width:160px;height:160px;font-size:22px}
 .wave i{background:#1A1A1A}
 .resume{border:2px solid var(--primary)}</style></head>

 <div class="top">
  <div><a class="crumb" href="index.html"><svg class="ic " aria-hidden="true"><use href="#i-chev-l"/></svg>3案の一覧へ</a>
   <h2>C  High-Contrast Friendly（見やすさ最優先）</h2><p>白地に黒に近い文字、2px の太い枠、操作は深い青緑1色。文字を一段大きくし、種目は1列のリスト。</p></div>
  <div class="viewsw" role="group" aria-label="表示の切り替え">
   <button aria-pressed="true" data-v="phones">スマホ 3画面</button>
   <button aria-pressed="false" data-v="desk">PC 幅の再生画面</button>
  </div>
 </div>
 <div id="phones" class="frames">
  <figure><figcaption>S1 ホーム</figcaption>
<section class="phone" aria-label="S1 ホーム">
 <div class="scr">
  <header class="apphead">
   <div class="brand"><b>Dance Count</b><small>for Ballroom</small></div>
   <button class="lang"><svg class="ic " aria-hidden="true"><use href="#i-globe"/></svg><span>日本語</span></button>
  </header>
  <button class="resume">
   <span class="resume-txt"><span class="k">前回</span><b>ワルツ</b></span>
   <span class="resume-go"><svg class="ic fill" aria-hidden="true"><use href="#i-play"/></svg><span>続きから</span></span>
  </button>
  <h1 class="h1">種目を選んでください</h1>
  <div class="tiles" role="group" aria-label="種目">
   <button class="tile"><b>ワルツ</b><small>3拍子</small></button><button class="tile"><b>タンゴ</b><small>4拍子</small></button><button class="tile"><b>ヴェニーズワルツ</b><small>3拍子</small></button><button class="tile"><b>スローフォックストロット</b><small>4拍子</small></button><button class="tile"><b>クイックステップ</b><small>4拍子</small></button><button class="tile"><b>ルンバ</b><small>4拍子</small></button><button class="tile"><b>チャチャチャ</b><small>4拍子</small></button><button class="tile"><b>サンバ</b><small>2拍子</small></button><button class="tile"><b>パソドブレ</b><small>2拍子</small></button><button class="tile"><b>ジャイブ</b><small>4拍子</small></button>

   <svg class="ic t-chev" aria-hidden="true"><use href="#i-chev-r"/></svg>
  </button>
 </div>
 <nav class="tabbar" aria-label="メインメニュー"><a class="tab" href="#" aria-current="page"><svg class="ic " aria-hidden="true"><use href="#i-home"/></svg><span>練習</span></a><a class="tab" href="#"><svg class="ic " aria-hidden="true"><use href="#i-list"/></svg><span>ルーティン</span></a><a class="tab" href="#"><svg class="ic " aria-hidden="true"><use href="#i-gear"/></svg><span>設定</span></a></nav>
</section></figure>
  <figure><figcaption>S2 再生（ワルツ・3拍目）</figcaption>
<section class="phone" aria-label="S2 再生">
 <div class="scr scr-dock">
  <header class="playhead"><h1 class="h1 dance">ワルツ</h1><span class="meter">3拍子</span></header>
  <div class="banner" role="alert"><svg class="ic b-ic" aria-hidden="true"><use href="#i-alert"/></svg>
   <div class="b-body"><b>音が出ていません。</b><p>本体の消音スイッチを確かめて、もう一度 ▶ を押してください。</p>
   <a class="b-link" href="#">音が出ない時は <svg class="ic " aria-hidden="true"><use href="#i-chev-r"/></svg></a></div></div>
  <div class="countbox" aria-label="いま 3拍目">
   <div class="now" aria-hidden="true">3</div>
