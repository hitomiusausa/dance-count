  <!-- 段8（Ruling 101）: 起動の殻。アプリが最初の画面を描くまでの白い時間に、アプリの名前だけを出す（言語が決まる前なので固有名詞だけ）。
       Preact の render は #app の中身を置き換えない（殻の横に画面を足す）ので、アプリが最初の画面を入れた後に removeBootShell()（App.tsx）で殻を外す。CSS は殻の 2 つだけ（600 バイト以下＝tools/pwa/check-pwa.js） -->
  <style>.dc-boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:20vh;background:#fff;color:#1B2A4A;font-family:-apple-system,system-ui,sans-serif}.dc-boot b{font-size:28px;font-weight:800}.dc-boot small{margin-top:4px;font-size:16px;color:#4A5670}</style>
</head>
<body>
  <div id="app"><div class="dc-boot" aria-hidden="true"><b>Dance Count</b><small>for Ballroom</small></div></div>

  <noscript><p style="position:relative;z-index:1;margin:0;padding:16px">社交ダンスのカウント（1・2・3／スロー・クイック）を声で鳴らす練習アプリ。無料・登録なし。先生が自分の声を録音して、生徒に配れます。<br>Voice counts for ballroom dance (1-2-3, slow-quick). Free, no sign-up. Teachers can record their own voice and share it with students.</p></noscript>
