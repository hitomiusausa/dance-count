<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1B2A4A">
  <meta name="apple-mobile-web-app-title" content="Dance Count">
  <meta name="dc-build" content="%DC_BUILD%">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <title>Dance Count</title>
  <!-- 段8（Ruling 101）: 起動の殻。アプリが最初の画面を描くまでの白い時間に、アプリの名前だけを出す（言語が決まる前なので固有名詞だけ）。
       Preact の render は #app の中身を置き換えない（殻の横に画面を足す）ので、アプリが最初の画面を入れた後に removeBootShell()（App.tsx）で殻を外す。CSS は殻の分だけ（1024 バイト以下＝tools/pwa/check-pwa.js）。
       D62: 紺の地に二人のうさぎ（下の殻の印・CSS の末尾の印は vite.config.ts の bootMark が src/app/brand/rabbit.ts の絵と動きに置き換える）。足元を軸に二人がワルツの 3 拍で傾き、裾が揺れる（1 小節 1.35 秒・動きを減らす設定では止まる） -->
  <style>.dc-boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:12vh;background:#1B2A4A;color:#FBF5EC;font-family:Inter,"Noto Sans JP",-apple-system,system-ui,sans-serif}.dc-boot b{margin-top:20px;font-size:28px;font-weight:800;letter-spacing:-.015em}.dc-boot small{font-size:16px;opacity:.8}/*%DC_BOOT_CSS%*/</style>
</head>
<body>
  <div id="app"><div class="dc-boot" aria-hidden="true">%DC_BOOT_MARK%<b>Dance Count</b><small>for Ballroom</small></div></div>
  <script type="module" src="./src/app/main.tsx"></script>
</body>
</html>
