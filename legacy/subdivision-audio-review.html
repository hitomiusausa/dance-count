<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>短拍音声の実測比較</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "Noto Sans JP", system-ui, sans-serif; color: #172137; background: #f3f6fb; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1050px, calc(100% - 32px)); margin: 34px auto 70px; }
    header { display: flex; align-items: start; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    h1 { margin: 0 0 8px; font-size: clamp(25px, 4vw, 38px); }
    header p { max-width: 720px; margin: 0; color: #657189; line-height: 1.7; }
    a { color: #315fe8; font-weight: 750; }
    .notice { padding: 14px 16px; border: 1px solid #ead08a; border-radius: 13px; color: #6b4d12; background: #fff9e8; line-height: 1.6; }
    .grid { display: grid; gap: 16px; margin-top: 18px; }
    .card { padding: 20px; border: 1px solid #dbe2ee; border-radius: 17px; background: white; box-shadow: 0 8px 30px #1d315014; }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 15px; }
    .card h2 { margin: 0; font-size: 19px; }
    .pattern { padding: 6px 10px; border-radius: 999px; color: #315fe8; background: #edf2ff; font-weight: 850; }
    .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .choice { padding: 14px; border: 1px solid #e0e5ed; border-radius: 12px; background: #fafbfc; }
    .choice.recommended { border-color: #9bcdb2; background: #f3fbf6; }
    .choice strong { display: block; margin-bottom: 8px; }
    audio { width: 100%; }
    .metrics { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
    .metrics span { padding: 4px 7px; border-radius: 7px; color: #5c687c; background: #edf0f5; font-size: 11px; font-weight: 700; }
    .recommended .metrics span { background: #dff2e6; }
    @media (max-width: 680px) { header { display: block; } header a { display: inline-block; margin-top: 12px; } .choices { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header><div><h1>短拍音声の実測比較</h1><p>同じtick位置から2ループ分を書き出しています。左は現在の重ね再生、右は次のカウント直前12msで前の声をフェードする候補です。</p></div><a href="./routine-editor.html">練習・編集へ戻る</a></header>
    <p class="notice">拍の発火位置は両方同じです。ここでは、短い「&」「a」で声が二重に聞こえる問題だけを比較します。</p>
    <section id="reviews" class="grid" aria-live="polite">読み込んでいます…</section>
  </main>
  <script type="module">
    const response = await fetch('./audio/subdivision-review/review.json', { cache: 'no-store' });
    if (!response.ok) throw new Error(`比較データを読み込めません（HTTP ${response.status}）`);
    const review = await response.json();
    document.querySelector('#reviews').replaceChildren(...review.results.map(item => {
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `<div class="card-head"><h2>${item.dance}・${item.bpm} BPM</h2><span class="pattern">${item.counts}</span></div>
        <div class="choices">
          <div class="choice"><strong>現在：音声を重ねる</strong><audio controls preload="metadata" src="./audio/subdivision-review/${item.current.file}"></audio><div class="metrics"><span>最大重なり ${item.current.maxOverlapMs}ms</span><span>ピーク ${item.current.peak}</span><span>クリップ ${item.current.clippedSamples} sample</span></div></div>
          <div class="choice recommended"><strong>候補：次の声の直前でフェード</strong><audio controls preload="metadata" src="./audio/subdivision-review/${item.fade.file}"></audio><div class="metrics"><span>重なり ${item.fade.maxOverlapMs}ms</span><span>短縮 ${item.fade.shortenedEvents}回</span><span>ピーク ${item.fade.peak}</span><span>クリップ ${item.fade.clippedSamples} sample</span></div></div>
        </div>`;
      return card;
    }));
  </script>
</body>
</html>
